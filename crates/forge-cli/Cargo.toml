[package]
name = "forge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Forge: git for agent runs."

[lib]
path = "src/lib.rs"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
crossterm = { workspace = true }
forge-anthropic = { path = "../forge-anthropic" }
forge-core = { path = "../forge-core" }
forge-gemini = { path = "../forge-gemini" }
forge-mcp = { path = "../forge-mcp" }
forge-openai = { path = "../forge-openai" }
forge-recorder = { path = "../forge-recorder" }
forge-storage = { path = "../forge-storage" }
futures-util = { workspace = true }
ratatui = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
